services:
  postgres:
    image: postgres:17
    container_name: promptflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: promptflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  backend:
    build: ./backend
    container_name: promptflow-backend
    ports:
      - "8080:8080"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      KIE_API_KEY: ${KIE_API_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/promptflow
    depends_on:
      - postgres
    volumes:
      - ./uploads:/app/uploads/results

  frontend:
    build: ./frontend
    container_name: promptflow-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
