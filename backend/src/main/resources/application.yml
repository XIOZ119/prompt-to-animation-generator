spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/promptflow
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  jackson:
    mapper:
      sort-properties-alphabetically: false

server:
  port: 8080


openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-5.4-mini

kie:
  api-key: ${KIE_API_KEY}
  model: google/nano-banana
  video-model: kling-2.6/image-to-video